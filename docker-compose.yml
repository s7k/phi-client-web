# phi-web スタック (backend + edge/frontend)
# 使い方: cp .env.docker.example .env し値を設定 → docker compose up --build
# 透過PNGは ./assets に配置(tools/gfx_convert で生成。レガシーBMPは別途用意)。

services:
  backend:
    build: ./backend
    environment:
      # 本番必須: uid暗号鍵(未設定なら起動時に一時鍵=再起動で復号不可)
      PHI_SECRET_KEY: ${PHI_SECRET_KEY:?set PHI_SECRET_KEY in .env}
      # CSRF/Origin 許可元(エッジの公開URL)
      PHI_ALLOWED_ORIGINS: ${PHI_ALLOWED_ORIGINS:-http://localhost:8080}
      PHI_DB_PATH: /data/phi.db
      PHI_ASSETS_DIR: /srv/assets
      # 本番モード: PHI_SECRET_KEY/PHI_ALLOWED_ORIGINS 未設定なら起動失敗(fail-closed)
      PHI_ENV: ${PHI_ENV:-production}
      # エッジ(nginx)を1段信頼しXFFから実クライアントIPを取得(レート制限の正確化)
      PHI_TRUSTED_PROXY_HOPS: ${PHI_TRUSTED_PROXY_HOPS:-1}
      # レガシー既定接続先(キャラ未指定時の既定。任意)
      PHI_HOST: ${PHI_HOST:-}
      PHI_PORT: ${PHI_PORT:-20000}
    volumes:
      - db:/data                      # SQLite 永続化
      - ./assets:/srv/assets:ro       # 透過PNG(ホスト側で生成・配置)
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"        # 本番はTLS終端を前段に置く(Caddy/LB等)
    restart: unless-stopped

volumes:
  db:
