# phi-web エッジ: FE静的配信 + backend(FastAPI)へのプロキシ
# FEビルド資産は /app/ 配下(A-28, assetsDir=app)、/assets は backend の透過PNG。衝突しない。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }

    # WebSocket (Upgrade)
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 透過PNGアセット(backend が StaticFiles 配信)
    location /assets/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA フォールバック。index.html はキャッシュさせない。Cache-Control が無いとブラウザが
    # Last-Modified から有効期間を推定し、再ビルド後も古い index.html(古いバンドル)を使い続ける。
    # /app/ のバンドルはファイル名にハッシュが入るのでキャッシュしてよい。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
