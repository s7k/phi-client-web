[project]
name = "phi-web-backend"
version = "0.1.0"
description = "phi-web ゲートウェイ (Python/FastAPI). レガシーSJISソケット ⇔ ブラウザ(UTF-8 JSON)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "cryptography",
    "Pillow",
    "websockets",
    "python-multipart",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.store" = ["schema.sql"]
"app" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
